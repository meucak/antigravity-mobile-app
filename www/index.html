<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>MakroTakip</title><script src="https://cdn.tailwindcss.com"></script><style>body{-webkit-tap-highlight-color:transparent;user-select:none;}input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}</style></head><body class="bg-slate-950 text-slate-100 min-h-screen font-sans"><div class="max-w-md mx-auto p-5 pb-10"><header class="flex justify-between items-center mb-8"><div class=""><h1 class="text-2xl font-black text-blue-500 tracking-tight">MAKROTAKİP</h1><p class="text-slate-500 text-xs font-medium uppercase tracking-widest">Günlük Beslenme Günlüğü</p></div><div class="bg-slate-900 p-2 rounded-full"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" /></svg></div></header><div class="bg-slate-900 rounded-3xl p-6 mb-8 shadow-2xl border border-slate-800"><div class="grid grid-cols-4 gap-4 text-center"><div class="flex flex-col"><span class="text-[10px] text-slate-500 font-bold uppercase mb-1">Kalori</span><span id="totalCal" class="text-xl font-black">0</span></div><div class="flex flex-col"><span class="text-[10px] text-red-500 font-bold uppercase mb-1">Prot</span><span id="totalP" class="text-xl font-black text-red-400">0g</span></div><div class="flex flex-col"><span class="text-[10px] text-green-500 font-bold uppercase mb-1">Karb</span><span id="totalC" class="text-xl font-black text-green-400">0g</span></div><div class="flex flex-col"><span class="text-[10px] text-yellow-500 font-bold uppercase mb-1">Yağ</span><span id="totalF" class="text-xl font-black text-yellow-400">0g</span></div></div></div><div class="bg-slate-900 rounded-3xl p-6 mb-8 border border-slate-800 shadow-xl"><h2 class="text-sm font-bold text-slate-400 uppercase mb-4 flex items-center"><span class="w-2 h-2 bg-blue-500 rounded-full mr-2"></span>Öğün Ekle</h2><div class="space-y-4"><input id="foodName" type="text" placeholder="Yemek adı (örn: Tavuk Pilav)" class="w-full bg-slate-800 border-none rounded-xl p-4 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all"><div class="grid grid-cols-4 gap-2"><input id="foodCal" type="number" placeholder="Kcal" class="bg-slate-800 border-none rounded-xl p-3 text-center text-sm outline-none focus:ring-2 focus:ring-blue-500"><input id="foodP" type="number" placeholder="P(g)" class="bg-slate-800 border-none rounded-xl p-3 text-center text-sm outline-none focus:ring-2 focus:ring-red-500"><input id="foodC" type="number" placeholder="K(g)" class="bg-slate-800 border-none rounded-xl p-3 text-center text-sm outline-none focus:ring-2 focus:ring-green-500"><input id="foodF" type="number" placeholder="Y(g)" class="bg-slate-800 border-none rounded-xl p-3 text-center text-sm outline-none focus:ring-2 focus:ring-yellow-500"></div><button onclick="addEntry()" class="w-full bg-blue-600 hover:bg-blue-500 active:scale-95 py-4 rounded-xl font-black text-sm uppercase tracking-widest transition-all shadow-lg shadow-blue-900/20">Listeye Ekle</button></div></div><div class="flex justify-between items-center mb-4"><h3 class="text-sm font-bold text-slate-400 uppercase">Bugünkü Kayıtlar</h3><button onclick="clearAll()" class="text-[10px] font-bold text-slate-600 uppercase hover:text-red-400 transition-colors">Tümünü Sil</button></div><div id="entryList" class="space-y-3"></div></div><script>let entries=JSON.parse(localStorage.getItem('macro_tracker_data'))||[];function save(){localStorage.setItem('macro_tracker_data',JSON.stringify(entries));render();}function addEntry(){const name=document.getElementById('foodName').value||'İsimsiz Öğün';const cal=parseInt(document.getElementById('foodCal').value)||0;const p=parseInt(document.getElementById('foodP').value)||0;const c=parseInt(document.getElementById('foodC').value)||0;const f=parseInt(document.getElementById('foodF').value)||0;if(cal===0&&p===0&&c===0&&f===0)return;entries.unshift({id:Date.now(),name,cal,p,c,f});document.querySelectorAll('input').forEach(i=>i.value='');save();}function deleteEntry(id){entries=entries.filter(e=>e.id!==id);save();}function clearAll(){if(confirm('Tüm veriler silinecek, emin misiniz?')){entries=[];save();}}function render(){const list=document.getElementById('entryList');let tCal=0,tP=0,tC=0,tF=0;list.innerHTML='';if(entries.length===0){list.innerHTML='<div class="text-center py-10 text-slate-600 text-sm italic">Henüz bir kayıt yok...</div>';}entries.forEach(e=>{tCal+=e.cal;tP+=e.p;tC+=e.c;tF+=e.f;list.innerHTML+=`<div class="bg-slate-900/50 p-4 rounded-2xl border border-slate-800 flex justify-between items-center animate-in fade-in slide-in-from-bottom-2 duration-300"><div><p class="font-bold text-slate-200">${e.name}</p><p class="text-[11px] text-slate-500 font-medium">${e.cal} kcal • P: ${e.p}g • K: ${e.c}g • Y: ${e.f}g</p></div><button onclick="deleteEntry(${e.id})" class="bg-slate-800 hover:bg-red-900/30 text-slate-500 hover:text-red-500 w-8 h-8 rounded-lg flex items-center justify-center transition-all">✕</button></div>`;});document.getElementById('totalCal').innerText=tCal;document.getElementById('totalP').innerText=tP+'g';document.getElementById('totalC').innerText=tC+'g';document.getElementById('totalF').innerText=tF+'g';}render();</script></body></html>
